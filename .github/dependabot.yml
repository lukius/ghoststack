version: 2

# Applies to version updates only. Security updates ignore the cooldown, the
# groups and the weekly schedule, and open as soon as an advisory is published.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Majors are migrations to schedule, not routine bumps. Dependabot drops
      # update-types for security updates, so major security fixes still arrive.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # certifi is a floor, raised only to force out a bad root. Installs already
      # resolve to the latest release, so bumping it weekly would change nothing.
      - dependency-name: certifi
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Majors are migrations to schedule, not routine bumps. Dependabot drops
      # update-types for security updates, so major security fixes still arrive.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Majors are migrations to schedule, not routine bumps. Dependabot drops
      # update-types for security updates, so major security fixes still arrive.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # Moving off Python 3.11 is a deliberate project decision, not a routine bump.
      - dependency-name: python
        update-types: [version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Majors are migrations to schedule, not routine bumps. Dependabot drops
      # update-types for security updates, so major security fixes still arrive.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      actions:
        patterns: ['*']
