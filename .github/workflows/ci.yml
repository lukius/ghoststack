name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check backend/ tests/
      - name: Ruff format check
        run: ruff format --check backend/ tests/
      - name: Pytest
        run: pytest tests/backend/ -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghoststack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image
        run: tools/check-image.sh ghoststack:ci
      # No QEMU is set up in this job, so this fails if the frontend stage stops
      # building natively. Under emulation, npm ci can crash and hang the release.
      - name: Build frontend stage for arm64 without emulation
        run: docker buildx build --platform linux/arm64 --target frontend .
